    function playTone(freq, dur, wave = "triangle", vol = 0.045) {
      if (!soundOn) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = wave;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

    function playNote(f, d, wave = "triangle", vol = 0.045) {

      const o = actx.createOscillator(), g = actx.createGain();
      o.type = wave;
      o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
      o.connect(g);
      g.connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + d);
    }

    function startMusic() {
      clearInterval(mLoop);

          document.getElementById("gBar").style.width = Math.max(0, (sec / 15) * 100) + "%";
          if (sec <= 0) {

            answer(-1);
          }
        }, 100);
      } else {
        document.getElementById("gClock").innerText = "♾️ Livre";
        document.getElementById("gBar").style.width = "100%";
      }

    function answer(idx) {

      const btns = document.querySelectorAll(".choice");
      btns.forEach(b => b.disabled = true);
      if (idx === q.a) {
        btns[idx].classList.add("win");
        const bonus = timed ? Math.round(sec * 4) : 0;
        score += q.pt + bonus;
        playNote(698.46, 0.25, "triangle", 0.09);
        document.getElementById("gNote").innerText = "✅ Nó comunitário conectado! (+" + (q.pt + bonus) + " pts) " + q.exp;
      } else {
        if (idx >= 0) btns[idx].classList.add("lose");
        btns[q.a].classList.add("win");
        playNote(175, 0.35, "sawtooth", 0.08);
        document.getElementById("gNote").innerText = (idx === -1 ? "⏰ Tempo esgotado! " : "❌ Resposta incorreta. ") + q.exp;
      }
      document.getElementById("gPts").innerText = "PONTOS: " + score;
      document.getElementById("gNext").classList.remove("off");
    }

    function nextStep() {
      step++;

      } else {

        showResult();
      }
    }

    function goStage() {

      ).join("");
    }

<body>
  <main class="sanctuary">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:0.82rem;color:#d8b4fe;">
      <span>✨ <strong>Ariell Santana do Nascimento</strong> • 1º Ano (Programação de Jogos Digitais)</span>
      <button class="btn-ghost" style="padding:5px 10px;font-size:0.8rem;" id="sndBtn" onclick="toggleMusic()">🎵 Música (Ré Maior): ON</button>
    </div>

    <div id="sHome">
      <div class="aura-orb"></div>
      <span class="sub-tag">JOGO 4 • SAÚDE ESPIRITUAL & PROPÓSITO INTEGRAL</span>
      <h1>AuraZen: Sentido & Harmonia</h1>
      <p style="color:#e9d5ff;line-height:1.5;">Avance pelas fases <strong>Fácil</strong> (1–3), <strong>Médio</strong> (4–6) e <strong>Difícil</strong> (7–9) com alternativas <strong>A, B, C, D e E</strong> sobre propósito de vida, valores éticos, gratidão e cuidado integral.</p>
      <input type="text" id="inpUser" value="Ariell Santana do Nascimento" maxlength="45">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <button class="btn-zen" onclick="startZen(true)">⏱️ Com Tempo (15s)</button>
        <button class="btn-ghost" onclick="startZen(false)">♾️ Sem Tempo (Livre)</button>
      </div>
    </div>

    <div id="sMid" class="hide" style="padding:26px 0;">
      <div class="aura-orb"></div>
      <h1 id="midHead"></h1>
      <p id="midSub" style="margin:12px 0 20px;color:#e9d5ff;"></p>
      <button class="btn-zen" style="width:100%;" onclick="goNextPhase()">Prosseguir Jornada ➡️</button>
    </div>

    <div id="sQuiz" class="hide">
      <div class="hud-row">
        <strong id="zPhase" style="color:#f472b6;">Fase: Fácil</strong>
        <span id="zProg">1/9</span>
        <strong id="zTime">⏱️ 15s</strong>
        <strong id="zPts" style="color:#e9d5ff;">0 pts</strong>
      </div>
      <div class="bar-bg"><div class="bar-fg" id="zBar"></div></div>
      <h2 id="zQuest" style="font-size:1.15rem;margin-bottom:16px;line-height:1.45;text-align:left;"></h2>
      <div id="zOpts"></div>
      <p id="zMsg" style="margin-top:10px;color:#f472b6;font-size:0.9rem;text-align:left;line-height:1.4;"></p>
      <button class="btn-zen hide" id="zNext" style="width:100%;margin-top:12px;" onclick="nextZen()">Próxima Reflexão ➡️</button>
    </div>

    <div id="sEnd" class="hide">
      <h1>🏆 Pódio Final — Saúde Espiritual</h1>
      <p id="zFinal" style="color:#e9d5ff;margin-top:6px;"></p>
      <div class="olympic" id="olympicBox"></div>
      <div class="s4" id="fourthBox"></div>
      <button class="btn-zen" style="width:100%;" onclick="location.reload()">🔄 Jogar Novamente</button>
    </div>
  </main>

  <script>
    const QLIST = [
      { ph: "Fácil", pt: 100, q: "Como a 'Saúde Espiritual' é definida na visão integral da saúde?", o: ["A) Apenas seguir uma única religião", "B) Busca por propósito, sentido de vida, valores éticos e paz interior", "C) Somente exercícios musculares", "D) Acumular bens materiais", "E) Ignorar a medicina"], a: 1, exp: "Abrange valores, transcendência e sentido existencial, respeitando cada pessoa." },
      { ph: "Fácil", pt: 100, q: "Qual benefício comprovado a prática diária da gratidão traz para a saúde?", o: ["A) Aumenta o ressentimento", "B) Reduz o estresse, melhora o humor e fortalece a resiliência emocional", "C) Causa insônia", "D) Diminui a empatia", "E) Nenhum efeito"], a: 1, exp: "Reconhecer aspectos positivos reduz o cortisol e amplia o bem-estar." },
      { ph: "Fácil", pt: 100, q: "O que significa praticar 'Mindfulness' (Atenção Plena)?", o: ["A) Preocupar-se com o futuro", "B) Estar consciente no momento presente, com foco e sem julgamento", "C) Fazer dez tarefas sem atenção", "D) Remoer erros passados", "E) Dormir em aula"], a: 1, exp: "A atenção plena acalma a mente agitada e conecta com o presente." },
      { ph: "Médio", pt: 150, q: "Como agir de acordo com valores éticos (honestidade, solidariedade) impacta o bem-estar?", o: ["A) Gera coerência interna, autoestima e paz de consciência", "B) Causa conflito moral", "C) Prejudica a digestão", "D) Impede o aprendizado", "E) Não influencia"], a: 0, exp: "Viver conforme os próprios princípios evita conflitos internos e fortalece a integridade." },
      { ph: "Médio", pt: 150, q: "Na reabilitação de doenças crônicas ou traumas, qual é o papel da esperança e do propósito?", o: ["A) Nenhum impacto", "B) Aumentam a adesão ao tratamento e a força emocional para superar obstáculos", "C) Substituem a fisioterapia", "D) Fazem desistir do tratamento", "E) Aumentam a dor"], a: 1, exp: "Um propósito claro sustenta a motivação durante longos processos de recuperação." },
      { ph: "Médio", pt: 150, q: "Por que momentos de silêncio e desconexão digital são importantes para o equilíbrio?", o: ["A) Favorecem o autoconhecimento e reduzem a sobrecarga mental", "B) Apagam a memória", "C) Aumentam a ansiedade", "D) Bloqueiam a criatividade", "E) Reduzem a oxigenação"], a: 0, exp: "Pausas contemplativas restauram a clareza mental e a serenidade." },
      { ph: "Difícil", pt: 200, q: "O que propõe o modelo 'Biopsicossocial-Espiritual' reconhecido na saúde humanizada?", o: ["A) Tratar apenas o órgão doente", "B) Cuidar do ser humano de forma integral: corpo, mente, relações sociais e dimensão espiritual", "C) Eliminar exames", "D) Focar só em estética", "E) Ignorar o sofrimento"], a: 1, exp: "Integra todas as dimensões que compõem a dignidade humana." },
      { ph: "Difícil", pt: 200, q: "Qual é o princípio central da 'Logoterapia', criada pelo psiquiatra Viktor Frankl?", o: ["A) Busca pelo poder financeiro", "B) A 'vontade de sentido': encontrar um propósito ajuda a superar adversidades", "C) Fuga das responsabilidades", "D) Isolamento social", "E) Negação das emoções"], a: 1, exp: "Para Viktor Frankl, a busca de sentido é a principal força motivadora humana." },
      { ph: "Difícil", pt: 200, q: "Como a prática do perdão (soltar mágoas crônicas) beneficia a saúde integral?", o: ["A) Aumenta a pressão arterial", "B) Reduz ruminação mental, tensão cardiovascular e promove libertação emocional", "C) Significa concordar com erros", "D) Causa perda de memória", "E) Não tem base científica"], a: 1, exp: "Perdoar liberta o organismo do estresse crônico gerado pelo ressentimento." }
    ];

    let i = 0, pts = 0, timed = true, sec = 15, loop = null;
    let ctx = null, bgm = null, on = true, uName = "Ariell Santana do Nascimento";

    function tone(f, d, wave = "sine", vol = 0.045) {
      if (!on) return;
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = wave;
      o.frequency.value = f;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + d);
    }

    function playAura() {
      clearInterval(bgm);
      const notes = [293.66, 369.99, 440.00, 587.33, 659.25, 587.33];
      let s = 0;
      bgm = setInterval(() => {
        if (on) tone(notes[s++ % notes.length], 0.5, "sine", 0.045);
      }, 460);
    }

    function toggleMusic() {
      on = !on;
      document.getElementById("sndBtn").innerText = on ? "🎵 Música (Ré Maior): ON" : "🔇 Música: OFF";
    }

    function startZen(isTimed) {
      uName = document.getElementById("inpUser").value.trim() || "Ariell Santana do Nascimento";
      timed = isTimed;
      playAura();
      document.getElementById("sHome").classList.add("hide");
      document.getElementById("sQuiz").classList.remove("hide");
      renderZen();
    }

    function renderZen() {
      clearInterval(loop);
      const item = QLIST[i];
      document.getElementById("zPhase").innerText = "Fase: " + item.ph;
      document.getElementById("zProg").innerText = (i + 1) + "/" + QLIST.length;
      document.getElementById("zPts").innerText = pts + " pts";
      document.getElementById("zQuest").innerText = (i + 1) + ". " + item.q;
      document.getElementById("zMsg").innerText = "";
      document.getElementById("zNext").classList.add("hide");

      const box = document.getElementById("zOpts");
      box.innerHTML = "";
      item.o.forEach((opt, idx) => {
        const b = document.createElement("button");
        b.className = "opt-zen";
        b.innerText = opt;
        b.onclick = () => checkZen(idx);
        box.appendChild(b);
      });

      if (timed) {
        sec = 15;
        document.getElementById("zTime").innerText = "⏱️ 15s";
        document.getElementById("zBar").style.width = "100%";
        loop = setInterval(() => {
          sec -= 0.1;
          document.getElementById("zTime").innerText = "⏱️ " + Math.max(0, Math.ceil(sec)) + "s";
          document.getElementById("zBar").style.width = Math.max(0, (sec / 15) * 100) + "%";
          if (sec <= 0) {
            clearInterval(loop);
            checkZen(-1);
          }
        }, 100);
      } else {
        document.getElementById("zTime").innerText = "♾️ Livre";
        document.getElementById("zBar").style.width = "100%";
      }
    }

    function checkZen(chosen) {
      clearInterval(loop);
      const item = QLIST[i];
      const btns = document.querySelectorAll(".opt-zen");
      btns.forEach(b => b.disabled = true);
      if (chosen === item.a) {
        btns[chosen].classList.add("ok");
        const bonus = timed ? Math.round(sec * 4) : 0;
        pts += item.pt + bonus;
        tone(739.99, 0.35, "sine", 0.09);
        document.getElementById("zMsg").innerText = "✅ Sabedoria alcançada! (+" + (item.pt + bonus) + " pts) " + item.exp;
      } else {
        if (chosen >= 0) btns[chosen].classList.add("bad");
        btns[item.a].classList.add("ok");
        tone(165, 0.35, "sawtooth", 0.08);
        document.getElementById("zMsg").innerText = (chosen === -1 ? "⏰ Tempo esgotado! " : "❌ Resposta incorreta. ") + item.exp;
      }
      document.getElementById("zPts").innerText = pts + " pts";
      document.getElementById("zNext").classList.remove("hide");
    }

    function nextZen() {
      i++;
      if (i === 3 || i === 6) {
        document.getElementById("sQuiz").classList.add("hide");
        document.getElementById("sMid").classList.remove("hide");
        document.getElementById("midHead").innerText = i === 3 ? "⚡ Fase 2: MÉDIO" : "🔥 Fase 3: DIFÍCIL";
        document.getElementById("midSub").innerText = "Parabéns, " + uName + "! Você conquistou " + pts + " pontos até aqui!";
        tone(659.25, 0.35, "sine", 0.09);
      } else if (i < QLIST.length) {
        renderZen();
      } else {
        endZen();
      }
    }

    function goNextPhase() {
      document.getElementById("sMid").classList.add("hide");
      document.getElementById("sQuiz").classList.remove("hide");
      renderZen();
    }

    function endZen() {
      document.getElementById("sQuiz").classList.add("hide");
      document.getElementById("sEnd").classList.remove("hide");
      tone(880, 0.45, "sine", 0.1);
      const rank = [
        { n: uName + " (Você)", s: pts },
        { n: "Guardião da Aura", s: 1200 },
        { n: "Sábio Astral", s: 780 },
        { n: "Buscador Zen", s: 390 }
      ].sort((a, b) => b.s - a.s);

      document.getElementById("zFinal").innerText = "Modo: " + (timed ? "Com Tempo (15s)" : "Sem Tempo (Livre)") + " • Pontuação Final: " + pts + " pts";
      document.getElementById("olympicBox").innerHTML =
        "<div class='step-box s2'><strong>🥈 2º VICE</strong><small>" + rank[1].n + "</small><strong>" + rank[1].s + " pts</strong></div>" +
        "<div class='step-box s1'><strong>🏆 1º CAMPEÃO</strong><small>" + rank[0].n + "</small><strong>" + rank[0].s + " pts</strong></div>" +
        "<div class='step-box s3'><strong>🥉 3º LUGAR</strong><small>" + rank[2].n + "</small><strong>" + rank[2].s + " pts</strong></div>";
      document.getElementById("fourthBox").innerHTML = "<strong>🏅 4º LUGAR:</strong> " + rank[3].n + " — <strong>" + rank[3].s + " pts</strong>";
    }
  <\/script>
</body>
</html>`
      }
    };

    // =========================================================================
    // ESTADO E CONTROLES DA CENTRAL INTERATIVA
    // =========================================================================
    let currentGameId = 1;
    let toastTimer = null;

    function showToast(msg) {
      const banner = document.getElementById("toastBanner");
      const text = document.getElementById("toastMessage");
      text.textContent = msg;
      banner.classList.remove("hidden", "toast-visible");
      void banner.offsetWidth;
      banner.classList.add("toast-visible");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add("hidden");
      }, 3200);
    }

    function selectGame(gameId) {
      currentGameId = gameId;
      const game = GAMES[gameId];

      // Atualiza estilos das 4 abas
      [1, 2, 3, 4].forEach(id => {
        const btn = document.getElementById("tab" + id);
        const g = GAMES[id];
        btn.className = "shrink-0 rounded-xl px-3 py-1.5 text-xs font-extrabold border transition cursor-pointer " +
          (id === gameId ? g.activeClass : g.inactiveClass);
      });

      // Atualiza o conteúdo do modal se estiver aberto
      document.getElementById("modalFileTitle").textContent = game.fileName + " — " + game.title;
      document.getElementById("modalCodeArea").value = game.html;

      // Renderiza o jogo completo ao vivo dentro do iframe
      const frame = document.getElementById("liveGameFrame");
      frame.srcdoc = game.html;
    }

    function copyActiveCode() {
      const game = GAMES[currentGameId];
      const code = game.html;

      // Copia segura via textarea temporária + execCommand('copy') compatível com iFrame
      const tempArea = document.createElement("textarea");
      tempArea.value = code;
      tempArea.setAttribute("readonly", "");
      tempArea.style.position = "fixed";
      tempArea.style.top = "-9999px";
      tempArea.style.left = "-9999px";
      document.body.appendChild(tempArea);
      tempArea.select();
      tempArea.setSelectionRange(0, code.length);

      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (err) {
        copied = false;
      }
      document.body.removeChild(tempArea);

      if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).catch(() => {});
      }

      showToast("✅ Código copiado! (" + game.fileName + ")");
    }

    function downloadActiveCode() {
      const game = GAMES[currentGameId];
      const blob = new Blob([game.html], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = game.fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      showToast("⬇️ Arquivo baixado: " + game.fileName);
    }

    function openCodeModal() {
      const game = GAMES[currentGameId];
      document.getElementById("modalFileTitle").textContent = game.fileName + " — " + game.title;
      document.getElementById("modalCodeArea").value = game.html;
      document.getElementById("codeModal").classList.remove("hidden");
    }

    function closeCodeModal() {
      document.getElementById("codeModal").classList.add("hidden");
    }

    function selectModalTextarea() {
      const area = document.getElementById("modalCodeArea");
      area.focus();
      area.select();
      showToast("🎯 Todo o código HTML foi selecionado!");
    }

    // Fecha o modal ao clicar fora da caixa interna ou pressionar ESC
    document.getElementById("codeModal").addEventListener("click", (e) => {
      if (e.target.id === "codeModal") closeCodeModal();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeCodeModal();
    });

    // Inicializa automaticamente no Jogo 1 ao carregar
    window.onload = () => {
      selectGame(1);
    };
  </script>
</body>
</html>
